name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the use case or the problem you're trying to solve.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How could it work? Any ideas on the UI or behaviour?
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives / notes
      description: Anything you've already tried or considered.
    validations:
      required: false
