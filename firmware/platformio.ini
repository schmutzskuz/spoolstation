; SpoolStation - Firmware der Station (ESP32 DevKit)
; Bauen:    pio run
; Hochladen: pio run -t upload   (macht der Nutzer)
; Monitor:  pio device monitor

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200

; Zwei App-Partitionen fuer OTA + Rollback (je 1,75 MB)
board_build.partitions = partitions_ota.csv

; Nach dem Build: factory.bin, ota.bin und firmware-manifest.json erzeugen
extra_scripts = post:scripts/post_build.py

build_flags =
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    lovyan03/LovyanGFX@^1.2.0
    adafruit/Adafruit PN532@^1.3.4
    adafruit/Adafruit BusIO@^1.17.0
    bblanchon/ArduinoJson@^7.2.0
    mathieucarbou/ESPAsyncWebServer@^3.3.0
    mathieucarbou/AsyncTCP@^3.3.0
