; Verkabelungs-Test fuer die SpoolStation (ESP32 DevKit)
; Testet Display (GC9A01), PN532 (HSPI) und EC11-Drehencoder.
; Bauen:   pio run
; Hochladen (macht der Nutzer): pio run -t upload
; Monitor:  pio device monitor

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200

; Bibliotheken mit fester Version (laut CLAUDE.md)
lib_deps =
    lovyan03/LovyanGFX@^1.2.0
    adafruit/Adafruit PN532@^1.3.4
    adafruit/Adafruit BusIO@^1.17.0
